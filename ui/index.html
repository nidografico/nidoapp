<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cargando…</title>
<style>
:root { --fondo: #06402b; --texto: #ffffff; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: grid; place-items: center; background: var(--fondo); color: var(--texto); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.c { text-align: center; padding: 24px; max-width: 420px; }
img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
h1 { font-size: 22px; margin: 18px 0 6px; }
p { margin: 0 0 18px; opacity: .85; line-height: 1.5; }
.barra { width: 160px; height: 4px; margin: 0 auto; border-radius: 4px; background: rgba(255,255,255,.2); overflow: hidden; }
.barra i { display: block; width: 40%; height: 100%; background: var(--texto); border-radius: 4px; animation: ir 1.1s ease-in-out infinite; }
@keyframes ir { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
button { border: 0; border-radius: 12px; padding: 12px 20px; font: inherit; font-weight: 700; cursor: pointer; background: var(--texto); color: var(--fondo); }
.sec { background: transparent; color: var(--texto); border: 1px solid rgba(255,255,255,.4); margin-left: 6px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="c">
    <img src="icono.png" alt="" onerror="this.remove()">
    <h1 id="nombre">Nido Gráfico</h1>
    <div id="cargando"><p>Conectando…</p><div class="barra"><i></i></div></div>
    <div id="sinRed" hidden>
        <p>No hay conexión con el servidor. Revisa tu internet; se vuelve a intentar sola.</p>
        <button type="button" id="reintentar">Reintentar ahora</button><button type="button" class="sec" id="ajustes">Ajustes</button>
    </div>
</div>
<script>
(function () {
    var invocar = function (c, a) { return window.__TAURI_INTERNALS__.invoke(c, a || {}); };
    var cfg = null, espera = 3000, t = null;
    function probar() {
        clearTimeout(t);
        document.getElementById('cargando').hidden = false;
        document.getElementById('sinRed').hidden = true;
        var ctrl = new AbortController();
        var corte = setTimeout(function () { ctrl.abort(); }, 8000);
        fetch(cfg.servidor, { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal })
            .then(function () { clearTimeout(corte); location.replace(cfg.servidor); })
            .catch(function () {
                clearTimeout(corte);
                document.getElementById('cargando').hidden = true;
                document.getElementById('sinRed').hidden = false;
                t = setTimeout(probar, espera);
                espera = Math.min(espera * 2, 30000);
            });
    }
    document.getElementById('reintentar').onclick = function () { espera = 3000; probar(); };
    document.getElementById('ajustes').onclick = function () { location.href = 'config.html'; };
    invocar('leer_config').then(function (c) {
        cfg = c || {};
        document.title = cfg.nombre || 'Nido Gráfico';
        document.getElementById('nombre').textContent = cfg.nombre || 'Nido Gráfico';
        if (cfg.color_fondo) document.documentElement.style.setProperty('--fondo', cfg.color_fondo);
        if (cfg.color_texto) document.documentElement.style.setProperty('--texto', cfg.color_texto);
        if (!cfg.servidor) { location.href = 'config.html'; return; }
        probar();
    }).catch(function () { document.getElementById('cargando').innerHTML = '<p>No se pudo leer la configuración de la app.</p>'; });
})();
</script>
</body>
</html>
