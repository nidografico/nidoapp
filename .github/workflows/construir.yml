# Construye los instaladores de Windows (.exe), Mac (.dmg) y Android (.apk) cuando el cPanel lo pide (app/escritorio).
name: Construir app
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (ej. 1.0.3)
        required: true
      android:
        description: Construir Android (si / no)
        required: false
        default: 'no'
      escritorio:
        description: Construir Windows y Mac (si / no). «no» = solo Android
        required: false
        default: 'si'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Version ${{ inputs.version }}
          body: Instaladores generados desde el cPanel.
  construir:
    needs: release
    if: ${{ inputs.escritorio != 'no' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            target: ''
            rust_targets: ''
            archivos: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            archivos: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      - run: npm install
      - run: npx tauri icon icono.png
      - name: Construir
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npx tauri build --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}
          else
            npx tauri build --bundles ${{ matrix.bundles }}
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: ${{ matrix.archivos }}  # Android (19-nov-2026): APK firmado con la llave de la empresa. La llave la crea el cPanel una sola vez (nido-privado) y la
  # guarda en los secretos del repositorio (ANDROID_KEYSTORE en base64 y ANDROID_KEYSTORE_PASS). Siempre la misma llave:
  # si cambia, los teléfonos no pueden actualizar la app (habría que desinstalarla).
  android:
    needs: release
    if: ${{ inputs.android == 'si' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # 22-nov-2026: sin paquetes por defecto (el paquete «tools» ya no existe y el paso fallaba); los necesarios van abajo
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Herramientas de Android
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      - run: npm install
      - name: Construir APK
        shell: bash
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          npx tauri android init --ci
          npx tauri icon icono.png
          npx tauri android build --apk --target aarch64 armv7
      - name: Firmar APK
        shell: bash
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KSPASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          echo "$KS" | base64 -d > llave.p12
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APK=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$APK" alineada.apk
          "$BT/apksigner" sign --ks llave.p12 --ks-type PKCS12 --ks-pass env:KSPASS --out app-android.apk alineada.apk
          "$BT/apksigner" verify app-android.apk
          rm -f llave.p12 alineada.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: app-android.apk
